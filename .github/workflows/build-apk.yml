name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Put repo name & version into the app
        run: |
          VERSION="1.0.${{ github.run_number }}"
          cat > app/src/main/assets/www/config.js <<CFG
          window.MM_CONFIG = { repo: "${{ github.repository }}", version: "$VERSION", dataBranch: "data" };
          CFG
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "M-Market-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: M-Market-APK
          path: M-Market-v*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: M-Market v${{ env.VERSION }}
          body: |
            📱 ફોનમાં ઇન્સ્ટોલ કરવા નીચેની **M-Market-v${{ env.VERSION }}.apk** ફાઇલ ડાઉનલોડ કરો.
          files: M-Market-v*.apk
          make_latest: true
